baseURL = 'https://elec.webpenson.com/'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = true
theme = "PaperMod"

[outputs]
  home = ["HTML", "RSS", "JSON"]
[outputFormats]
  [outputFormats.JSON]
    baseName = "searchindex"
    isPlainText = true
    mediaType = "application/json"

[languages]
  [languages.zh]
    locale = 'zh-CN'
    label = '简体中文'
    title = '电气工具箱'
    weight = 1
    contentDir = "content/zh"
    [languages.zh.menus]
      [[languages.zh.menus.main]]
        name = "首页"
        url = "/"
        weight = 1
      [[languages.zh.menus.main]]
        name = "工具分类"
        url = "/categories"
        weight = 2
      [[languages.zh.menus.main]]
        name = "关于"
        url = "/about"
        weight = 3

  [languages.en]
    locale = 'en-US'
    label = 'English'
    title = 'Electrical Toolbox'
    weight = 2
    contentDir = "content/en"
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = "Home"
        url = "/"
        weight = 1
      [[languages.en.menus.main]]
        name = "Categories"
        url = "/categories"
        weight = 2
      [[languages.en.menus.main]]
        name = "About"
        url = "/about"
        weight = 3

[params]
    search = true
    showSearch = true
    [params.searchConfig]
        fuseOpts = { isCaseSensitive = false, includeScore = true, shouldSort = true, threshold = 0.3, location = 0, distance = 100, maxPatternLength = 32, minMatchCharLength = 1, keys = ["title", "content"] }

    ShowNav = true
    disableSpecial1stPost = true

    [env]
        production = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
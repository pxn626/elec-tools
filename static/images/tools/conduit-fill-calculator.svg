<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="conduitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="480" height="270" rx="16" fill="url(#bgGrad)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="480" height="56" rx="16" fill="#1e40af"/>
  <rect x="0" y="40" width="480" height="16" fill="#1e40af"/>
  <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
        font-size="20" font-weight="700" fill="#ffffff">Conduit Fill Calculator</text>
  <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
        font-size="11" font-weight="500" fill="#bfdbfe">NEC Chapter 9 / Annex C · EMT · PVC · RMC · IMC</text>

  <!-- Conduit cross-section (outer circle, label A_conduit) -->
  <g transform="translate(120, 150)">
    <circle r="78" fill="#1e3a8a" opacity="0.15"/>
    <circle r="60" fill="none" stroke="url(#conduitGrad)" stroke-width="14"/>
    <circle r="60" fill="#ffffff"/>
    <!-- Three wire cross-sections inside (12 AWG THHN) -->
    <g fill="#0c4a6e" stroke="#082f49" stroke-width="1.5">
      <circle cx="0" cy="-30" r="9"/>
      <circle cx="-26" cy="15" r="9"/>
      <circle cx="26" cy="15" r="9"/>
    </g>
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Conduit + 3 wires</text>
    <text x="0" y="116" font-family="SF Mono, Monaco, Consolas, monospace"
          font-size="10" fill="#475569" text-anchor="middle">fill = 13.1%</text>
  </g>

  <!-- Arrows & fill info (middle) -->
  <g transform="translate(240, 110)">
    <!-- fill fill bar -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
          font-size="13" font-weight="700" fill="#1e293b">Fill %</text>
    <rect x="0" y="10" width="80" height="14" fill="#e5e7eb" rx="4"/>
    <rect x="0" y="10" width="33" height="14" fill="#2563eb" rx="4"/>
    <text x="40" y="42" font-family="SF Mono, Monaco, Consolas, monospace"
          font-size="11" fill="#1e293b" text-anchor="middle">40% Limit</text>
    <text x="40" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
          font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">✓ Compliant</text>
  </g>

  <!-- Trade size ladder (right) -->
  <g transform="translate(360, 95)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
          font-size="12" font-weight="700" fill="#1e293b">NEC Trade Sizes</text>
    <g font-family="SF Mono, Monaco, Consolas, monospace" font-size="10" fill="#334155">
      <rect x="0" y="10" width="80" height="14" fill="#f1f5f9" rx="3"/>
      <text x="6" y="21">1/2"</text>
      <text x="74" y="21" text-anchor="end" fill="#2563eb" font-weight="700">✓</text>

      <rect x="0" y="28" width="80" height="14" fill="#dbeafe" rx="3"/>
      <text x="6" y="39" font-weight="700">3/4"</text>
      <text x="74" y="39" text-anchor="end" fill="#16a34a" font-weight="700">OK</text>

      <rect x="0" y="46" width="80" height="14" fill="#f1f5f9" rx="3"/>
      <text x="6" y="57">1"</text>
      <text x="74" y="57" text-anchor="end" fill="#64748b">—</text>

      <rect x="0" y="64" width="80" height="14" fill="#f1f5f9" rx="3"/>
      <text x="6" y="75">1-1/4"</text>
      <text x="74" y="75" text-anchor="end" fill="#64748b">—</text>

      <rect x="0" y="82" width="80" height="14" fill="#f1f5f9" rx="3"/>
      <text x="6" y="93">1-1/2"</text>
      <text x="74" y="93" text-anchor="end" fill="#64748b">—</text>

      <rect x="0" y="100" width="80" height="14" fill="#f1f5f9" rx="3"/>
      <text x="6" y="111">2"</text>
      <text x="74" y="111" text-anchor="end" fill="#64748b">—</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="24" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="10" font-weight="600" fill="#1e40af">Mode A — Verify</text>
  <text x="130" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="10" font-weight="600" fill="#1e40af">Mode B — Recommend</text>
  <text x="276" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="10" font-weight="600" fill="#1e40af">Mode C — Mixed</text>
  <text x="400" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="10" font-weight="500" fill="#475569">elec.webpenson.com</text>
</svg>

- id: tp_js_tip_low_pf
  translation: "⚡ Power factor too low (cosφ<{cos}). Utility reactive power penalty applies. Recommend SVG/capacitor compensation, target ≥0.90."
- id: tp_js_tip_med_pf
  translation: "💡 Power factor slightly low (cosφ={cos}). Compensate to 0.90~0.95 to reduce line loss and transformer load."
- id: tp_js_tip_good_pf
  translation: "✓ Good power factor (cosφ={cos}). In optimal range. Beware over-compensation causing reactive power export."
- id: tp_js_warn_cos1
  translation: "⚠ cosφ=1 is pure resistive — rare in industrial settings. Acceptable if post-compensation data."

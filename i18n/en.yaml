  translation: "🔌 High-current recommendation: 380V/{I}A requires 5×{size}mm² five-core Cu cable, breaker set at 1.25×."
- id: tp_js_tip_cable_overflow
  translation: "🔌 380V/{I}A exceeds 315A table range. Consult professional engineer for cable and breaker selection (usually ≥150mm² + medium-voltage)."
- id: tp_js_tip_q_ratio
  translation: "⚡ Reactive component too high (Q/S={ratio}%). Transformer and lines must be sized for S={S}kVA not P={P}kW, significantly increasing capacity requirements."
- id: tp_js_tip_s_more
  translation: "💡 Apparent power S is {pct}% more than active P. Post-compensation sizing can be reduced."
- id: tp_js_tip_s_good
  translation: "✓ Good power factor. S close to P, high distribution capacity utilization."
- id: tp_js_tip_no_needed
  translation: "⚠ Target cosφ₂ ({cos2}) ≤ current cosφ₁ ({cos1}). No compensation needed. Raise cosφ₂ (e.g. 0.90~0.95)."
- id: tp_js_warn_over_comp
  translation: "⚠ Target cosφ₂ > 0.98 risks over-compensation (reactive power export to grid), causing reactive power penalty. 0.90~0.95 is most economical."
- id: tp_js_tip_large_qc
  translation: "🏭 Large compensation ({qc} kVAr). Tips: ① Grouped automatic switching (avoid over-comp) ② SVG preferred (fast response) ③ 480V capacitor bank (avoid harmonic amplification from 380V direct compensation)."
- id: tp_js_tip_med_qc
  translation: "⚙ Medium compensation. Recommended: ① SVG (static VAR generator, <10ms response) ② Or TSC (thyristor-switched capacitors)."
- id: tp_js_tip_small_qc
  translation: "✓ Small compensation. Standard capacitor bank (contactor-switched) sufficient — low cost, simple maintenance."

- id: vd_disclaimer
  translation: "⚠️ <strong>Reference only.</strong> V-drop calculations are NEC-aware but final conductor sizing must be verified by a licensed electrician and approved by your local Authority Having Jurisdiction (AHJ). This calculator ignores conductor reactance (X) which becomes significant for cables > 600 V or runs > 500 ft; for those applications consult IEEE Std 141 (Red Book) or a power-quality engineer."
- id: vd_js_err_enter_values
  translation: "Enter load amps, kW, or select a preset."
- id: vd_js_err_exceed_750kcmil

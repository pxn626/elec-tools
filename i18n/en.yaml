- id: vd_js_vdrop_green_nec647
  translation: "🟢 NEC 647 Compliant — within 3% branch limit"
- id: vd_js_vdrop_yellow_nec647
  translation: "🟡 NEC 647 — within 6% combined, exceeds 3% branch"
- id: vd_js_vdrop_red_nec647
  translation: "🔴 NEC 647 — exceeds 6% combined limit"
- id: vd_js_vdrop_green
  translation: "🟢 NEC 210.19 / 215.2 Compliant — within 3% branch limit"
- id: vd_js_vdrop_yellow
  translation: "🟡 Within 5% combined, exceeds 3% branch — consider upsizing"
- id: vd_js_vdrop_red
  translation: "🔴 Exceeds 5% combined — upsize AWG, shorten run, or raise voltage"
- id: vd_js_tip_nec647
  translation: "ℹ <strong>NEC 647 mode active.</strong> 3% branch / 6% combined applied (instead of 3% / 5%) for sensitive electronic equipment per NFPA 70 Article 647."
- id: vd_js_tip_auto_awg
  translation: "✓ <strong>Smallest compliant AWG picked automatically.</strong> {awg} at {temp} °C — V-drop {pct}% ≤ 3% branch (NEC 210.19(A) IN No. 4)."
- id: vd_js_tip_vdrop_red_lowv
  translation: "⚠️ <strong>V-drop exceeds NEC 5% combined limit.</strong> For low-voltage DC, stepping up the battery voltage (12 V → 24 V → 48 V) quarters the current and halves / quarters V-drop. Otherwise upsize 1–2 AWG sizes or shorten the run."
- id: vd_js_tip_vdrop_red
  translation: "⚠️ <strong>V-drop exceeds NEC 5% combined limit.</strong> Upsize 1–2 AWG sizes, shorten the run, or raise the system voltage (e.g. 240 V → 480 V halves V-drop). Pair with the <a href=\"/tools/wire-size-calculator/\">wire size calculator</a> to confirm ampacity."
- id: vd_js_tip_vdrop_yellow_al
  translation: "💡 <strong>V-drop exceeds 3% branch but within 5% combined.</strong> Consider upsizing one AWG (Al has ~61% the conductivity of Cu — typically need 2 sizes larger for V-drop parity). Verify with your AHJ."
- id: vd_js_tip_vdrop_yellow
  translation: "💡 <strong>V-drop exceeds 3% branch but within 5% combined (NEC 215.2(A) IN No. 3).</strong> For motor loads or sensitive electronics, consider upsizing one AWG. Pair with the <a href=\"/tools/circuit-breaker-sizing-calculator/\">circuit breaker sizing calculator</a> for OCPD selection."
- id: vd_js_tip_vdrop_green_lowv
  translation: "✓ <strong>Fully NEC-compliant.</strong> V-drop within 3% branch (NEC 210.19(A) IN No. 4). {mat} conductor at {temp} °C. For long-run DC, consider parallel conductors if length must exceed 200 ft."
- id: vd_js_tip_vdrop_green
  translation: "✓ <strong>Fully NEC-compliant.</strong> V-drop within the 3% branch recommendation (NEC 210.19(A) IN No. 4) and 5% combined (NEC 215.2(A) IN No. 3). Pair the conductor with the breaker via the <a href=\"/tools/circuit-breaker-sizing-calculator/\">circuit breaker sizing calculator</a>."
